<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Natverk NOC — Hosts</title>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    .hosts-toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .hosts-toolbar input {
      flex: 1; min-width: 200px; background: var(--bg-canvas); border: 1px solid var(--border-2); color: var(--text-primary);
      padding: 8px 10px; font-size: 12.5px; font-family: var(--sans); outline: none;
    }
    .hosts-toolbar input:focus { border-color: var(--accent); }

    .hosts-list-wrap { max-height: calc(100vh - 220px); overflow: auto; }
    .hosts-list { display: flex; flex-direction: column; }
    .hosts-empty { padding: 30px 20px; text-align: center; color: var(--text-muted); font-family: var(--sans); font-size: 12.5px; }

    /* Linha só com o essencial (host/fabricante/grupo/ip/ssh/snmp) -- o resto
       (modelo, usuário SSH, porta, SNMP community/porta, coordenadas) fica
       escondido até o operador abrir "Mais detalhes". Grid em vez de flex
       pra header e linhas ficarem alinhados em coluna. */
    .hosts-header-row, .host-row {
      display: grid; grid-template-columns: 1.3fr 0.9fr 1fr 0.9fr 84px 84px 28px;
      align-items: center; gap: 10px; padding: 10px 20px;
    }
    .hosts-header-row {
      border-bottom: 1px solid var(--border); font-family: var(--sans); font-size: 10.5px;
      font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em;
    }
    .host-row { border-bottom: 1px solid var(--border-dim); cursor: pointer; }
    .host-row:hover { background: rgba(255,255,255,0.03); }
    .host-col {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: var(--sans); font-size: 12.5px; color: var(--text-secondary);
    }
    .host-col-name { color: var(--text-primary); font-weight: 600; }
    .host-col-ip { font-family: var(--mono); color: var(--text-muted); font-size: 12px; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 5px; font-family: var(--sans); font-size: 10.5px;
      font-weight: 600; padding: 3px 8px; border-radius: 999px; letter-spacing: 0.02em; white-space: nowrap;
    }
    .status-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .status-pill.ok { background: rgba(62,207,106,0.14); color: var(--green); }
    .status-pill.fail { background: rgba(229,72,77,0.14); color: var(--red); }
    .status-pill.unknown { background: rgba(138,138,138,0.14); color: var(--text-muted); }

    /* A seta abre o modal de edição (mesma informação, só que editável) --
       não existe mais painel de detalhes inline pra manter. */
    .host-expand-btn {
      width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; color: var(--text-muted); cursor: pointer; border-radius: var(--radius-sm);
      justify-self: end;
    }
    .host-expand-btn:hover { color: var(--text-primary); background: var(--bg-canvas); }
    .host-expand-btn svg { width: 14px; height: 14px; }

    .ctx-menu {
      position: fixed; z-index: 2000; min-width: 170px; background: var(--bg-panel); border: 1px solid var(--border-2);
      border-radius: var(--radius-sm); box-shadow: var(--shadow-card); padding: 4px; font-family: var(--sans); font-size: 12.5px;
    }
    .ctx-menu[hidden] { display: none; }
    .ctx-menu button {
      display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: none; text-align: left;
      color: var(--text-primary); padding: 7px 10px; border-radius: var(--radius-sm); cursor: pointer; font-family: var(--sans); font-size: 12.5px;
    }
    .ctx-menu button:hover { background: var(--accent-dim); }
    .ctx-menu button.danger { color: var(--red); }
    .ctx-menu button.danger:hover { background: rgba(229,72,77,0.14); }
    .ctx-menu button svg { width: 14px; height: 14px; flex-shrink: 0; }

    .modal-form { width: 440px; max-height: 84vh; overflow-y: auto; }
    .modal-form h4 { margin: 20px 20px 16px; }
    .modal-form-body { padding: 0 20px 20px; display: flex; flex-direction: column; gap: 2px; }
    .modal-form-body input, .modal-form-body select { margin-bottom: 8px; }
    .modal-form-body .row2 { display: flex; gap: 8px; }
    .modal-form-body .row2 > * { flex: 1; }
    .modal-form-body summary {
      cursor: pointer; color: var(--text-muted); font-size: 11.5px; font-family: var(--sans);
      letter-spacing: 0.06em; margin-top: 4px;
    }
    .modal-form-body summary:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="nav-wrap">
      <nav class="nav notch">
        <a href="/" class="nav-logo">
          <span class="logo-main">NÄTVERK</span>
          <span class="logo-sub">NOC</span>
        </a>
        <div class="nav-section">
          <div class="nav-section-label"><span class="label-text">Operação</span></div>
          <a href="/" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
            Dashboard
          </a>
          <a href="/agente.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            Agente
          </a>
          <a href="/mapa.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
            Mapa
          </a>
          <a href="/hosts.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><line x1="6" y1="7" x2="6.01" y2="7"/><line x1="6" y1="17" x2="6.01" y2="17"/></svg>
            Hosts
          </a>
          <a href="/circuitos.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M9 19h8a2 2 0 0 0 2-2v-1a2 2 0 0 0-2-2H9a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2h6"/></svg>
            Circuitos
          </a>
          <a href="/alertas.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            Alertas<span class="nav-badge" id="nav-alerts-badge" hidden>0</span>
          </a>
          <div class="nav-section-label"><span class="label-text">Sistema</span></div>
          <a href="/configuracoes.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Configurações
          </a>
        </div>
        <div class="nav-footer">
          <div class="nav-avatar" id="nav-avatar">?</div>
          <div class="nav-user" id="nav-user"></div>
          <button class="nav-logout" id="nav-logout" type="button" title="Sair">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </nav>
    </div>
    <div class="main-col">
      <div class="topbar-wrap">
        <header class="topbar notch">
          <div class="topbar-title-row">
            <h1>Hosts</h1>
            <div class="topbar-rule"></div>
          </div>
          <div class="topbar-actions">
            <button class="alerts-bell" id="alerts-bell" type="button" title="Alertas">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span class="alerts-badge" id="alerts-badge" hidden>0</span>
            </button>
          </div>
          <button class="btn-primary" id="new-host-btn" type="button">+ Novo host</button>
        </header>
      </div>
      <main class="content-area">
        <div class="panel">
          <div class="hosts-toolbar">
            <input id="host-search" placeholder="Buscar por nome, IP ou grupo..." />
          </div>
          <div class="hosts-list-wrap">
            <div class="hosts-header-row">
              <div>Host</div><div>Fabricante</div><div>Grupo</div><div>IP</div><div>SSH</div><div>SNMP</div><div></div>
            </div>
            <div class="hosts-list" id="hosts-list"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Outside .app-shell on purpose: .topbar-wrap's filter + .topbar's
       clip-path (.notch) would otherwise contain/clip a fixed-position
       descendant to the 50px-tall topbar. -->
  <div class="alerts-panel" id="alerts-panel" hidden>
    <div class="alerts-panel-header">Alertas ativos</div>
    <div id="alerts-list"></div>
  </div>

  <div class="ctx-menu" id="host-ctx-menu" hidden>
    <button type="button" data-action="edit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
      Editar
    </button>
    <button type="button" data-action="test-ssh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      Testar SSH
    </button>
    <button type="button" data-action="test-snmp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 16 0"/><path d="M7.5 12a4.5 4.5 0 0 1 9 0"/><circle cx="12" cy="12" r="1"/></svg>
      Testar SNMP
    </button>
    <hr>
    <button type="button" class="danger" data-action="delete">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      Remover
    </button>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <div class="detail-modal modal-form" id="host-modal">
    <h4 id="host-modal-title">Novo host</h4>
    <form class="modal-form-body" id="host-form">
      <label class="field-label" for="host-name">Nome do host</label>
      <input id="host-name" name="name" placeholder="ex: KM30-SWITCH-01" required />

      <label class="field-label" for="host-ip">IP</label>
      <input id="host-ip" name="ip" placeholder="ex: 192.168.1.1" required />

      <label class="field-label" for="group-select">Grupo</label>
      <select name="group_id" id="group-select">
        <option value="">Selecione o grupo...</option>
      </select>

      <div class="row2">
        <div>
          <label class="field-label" for="host-vendor">Fabricante</label>
          <select name="vendor" id="host-vendor">
            <option value="">Selecione...</option>
            <option value="huawei">Huawei</option>
            <option value="mikrotik">Mikrotik</option>
            <option value="datacom">Datacom</option>
            <option value="a10">A10</option>
            <option value="outro">Outro</option>
          </select>
        </div>
        <div>
          <label class="field-label" for="host-model">Modelo</label>
          <input id="host-model" name="model" placeholder="ex: S5720" />
        </div>
      </div>

      <div class="row2">
        <div>
          <label class="field-label" for="host-community">Comunidade SNMP</label>
          <input id="host-community" name="community" placeholder="public" value="public" />
        </div>
        <div>
          <label class="field-label" for="host-port">Porta SNMP</label>
          <input id="host-port" name="port" placeholder="161" value="161" />
        </div>
      </div>

      <div class="row2">
        <div>
          <label class="field-label" for="host-lat">Latitude (opcional)</label>
          <input id="host-lat" name="lat" placeholder="ex: -4.34" type="number" step="any" min="-90" max="90" />
        </div>
        <div>
          <label class="field-label" for="host-lng">Longitude (opcional)</label>
          <input id="host-lng" name="lng" placeholder="ex: -55.78" type="number" step="any" min="-180" max="180" />
        </div>
      </div>

      <details>
        <summary>Credenciais SSH (opcional)</summary>
        <div style="display:flex; flex-direction:column; gap:4px; margin-top:8px;">
          <label class="field-label" for="host-ssh-user">Usuário SSH</label>
          <input id="host-ssh-user" name="ssh_user" placeholder="ex: monitoramento" />
          <label class="field-label" for="host-ssh-pass">Senha SSH</label>
          <input id="host-ssh-pass" name="ssh_pass" placeholder="••••••••" type="password" />
          <label class="field-label" for="host-ssh-port">Porta SSH</label>
          <input id="host-ssh-port" name="ssh_port" placeholder="22" />
        </div>
      </details>
      <button class="btn-primary" type="submit" id="host-form-submit">Criar host</button>
      <p id="host-form-status" class="form-status"></p>
    </form>
  </div>

  <script src="js/nav.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/hosts.js"></script>
</body>
</html>
