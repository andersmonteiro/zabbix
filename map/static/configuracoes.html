<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Natverk NOC — Configurações</title>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    .config-shell { flex: 1; padding: 24px; max-width: 480px; }
    form.inline { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    form.inline input { background: #232326; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; padding: 6px 8px; color: inherit; font-size: 13px; }
    form.inline button { padding: 7px; border-radius: 6px; border: 1px solid rgba(80,160,255,0.5); background: rgba(80,160,255,0.15); color: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div class="app-shell">
    <nav class="nav">
      <div class="nav-title">Natverk NOC</div>
      <a href="/" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Início
      </a>
      <a href="/hosts.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><line x1="6" y1="7" x2="6.01" y2="7"/><line x1="6" y1="17" x2="6.01" y2="17"/></svg>
        Adicionar hosts
      </a>
      <a href="/circuitos.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M9 19h8a2 2 0 0 0 2-2v-1a2 2 0 0 0-2-2H9a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2h6"/></svg>
        Circuitos
      </a>
      <a href="/configuracoes.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Configurações
      </a>
      <div class="nav-footer">
        <div class="nav-user" id="nav-user"></div>
        <button class="nav-item nav-logout" id="nav-logout" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sair
        </button>
      </div>
    </nav>
    <div class="config-shell">
      <h3>Foto de equipamento por modelo</h3>
      <p>O nome do modelo deve ser exatamente igual ao campo "Modelo" usado ao cadastrar um ponto em Circuitos.</p>
      <form class="inline" id="upload-form">
        <input name="model" placeholder="Modelo, ex: Huawei MA5800-X2" required />
        <input name="file" type="file" accept=".png,.jpg,.jpeg,.svg,.webp" required />
        <button type="submit">Enviar imagem</button>
      </form>
      <p id="upload-status"></p>

      <h3>Usuários com acesso ao mapa</h3>
      <div id="users-list"></div>
      <form class="inline" id="user-form">
        <input name="username" placeholder="Usuário" required />
        <input name="password" type="password" placeholder="Senha (mín. 6 caracteres)" required minlength="6" />
        <button type="submit">Criar usuário</button>
      </form>
      <p id="user-status"></p>
    </div>
  </div>
  <script src="js/nav.js"></script>
  <script>
    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const model = form.model.value;
      const file = form.file.files[0];
      const body = new FormData();
      body.append('file', file);
      const resp = await fetch(`/api/equipment-images/${encodeURIComponent(model)}`, { method: 'POST', body });
      document.getElementById('upload-status').textContent = resp.ok
        ? `Imagem salva para "${model}".`
        : 'Falha ao enviar — verifique a extensão do arquivo.';
      if (resp.ok) form.reset();
    });

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    async function loadUsers() {
      const resp = await fetch('/api/users');
      const users = await resp.json();
      const list = document.getElementById('users-list');
      list.innerHTML = users.map((u) => `
        <div class="list-item" data-id="${esc(u.id)}">
          <span>${esc(u.username)}</span>
          <button type="button" class="user-delete" data-id="${esc(u.id)}" style="background:none;border:none;color:#e5484d;cursor:pointer;">Remover</button>
        </div>
      `).join('');
      list.querySelectorAll('.user-delete').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const resp = await fetch(`/api/users/${btn.dataset.id}`, { method: 'DELETE' });
          if (resp.ok) {
            await loadUsers();
          } else {
            const body = await resp.json().catch(() => ({}));
            document.getElementById('user-status').textContent = body.error || 'Falha ao remover usuário.';
          }
        });
      });
    }

    document.getElementById('user-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const statusEl = document.getElementById('user-status');
      statusEl.textContent = '';
      const resp = await fetch('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: form.username.value, password: form.password.value }),
      });
      if (resp.ok) {
        form.reset();
        statusEl.textContent = 'Usuário criado.';
        await loadUsers();
      } else {
        const body = await resp.json().catch(() => ({}));
        statusEl.textContent = body.error || 'Falha ao criar usuário.';
      }
    });

    loadUsers();
  </script>
</body>
</html>
