<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Natverk NOC — Circuitos</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.3/dist/leaflet-geoman.css" />
  <link rel="stylesheet" href="css/app.css" />
  <style>
    .circuitos-shell { display: flex; flex: 1; min-height: 0; gap: 24px; padding: 24px; align-items: flex-start; overflow-y: auto; }
    .circuit-builder { flex: 1; max-width: 640px; }
    .section-label {
      font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-muted); margin: 0 0 12px;
    }
    .section-label .slashes { color: var(--accent); margin-right: 6px; }

    .circuits-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .circuit-chip {
      padding: 7px 14px; border: 1px solid var(--border); background: var(--bg-panel);
      font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; cursor: pointer;
    }
    .circuit-chip.selected { border-color: var(--accent); color: var(--accent); }
    #new-circuit-btn { margin-bottom: 24px; }

    .ab-flow { display: flex; align-items: stretch; gap: 14px; margin-bottom: 16px; }
    .ab-side {
      flex: 1; background: var(--bg-panel); border: 1px solid var(--border);
      box-shadow: var(--shadow-card); padding: 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .ab-side select { width: 100%; }
    .ab-arrow {
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: var(--accent); font-family: var(--mono); flex-shrink: 0; width: 24px;
    }
    .side-label {
      font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--accent);
    }
    #segment-form select:disabled { opacity: 0.5; }
    #segment-iface-hint { font-size: 11px; }
    #segment-submit-btn { width: 100%; margin-top: 4px; }

    .mini-map-card { width: 280px; flex-shrink: 0; }
    #editor-map {
      width: 100%; height: 220px; border: 1px solid var(--border); box-shadow: var(--shadow-card);
    }
    #edit-path-btn { margin-top: 10px; width: 100%; }
    #segment-warning { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="nav-wrap">
      <nav class="nav notch">
        <a href="/" class="nav-logo">
          <span class="logo-main">Nätverk</span>
          <span class="logo-sub">NOC</span>
        </a>
        <div class="nav-section">
          <div class="nav-section-label"><span class="slashes">//</span><span class="label-text">Mapa</span></div>
          <a href="/" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Início
          </a>
          <a href="/agente.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            Agente
          </a>
          <a href="/hosts.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><line x1="6" y1="7" x2="6.01" y2="7"/><line x1="6" y1="17" x2="6.01" y2="17"/></svg>
            Hosts
          </a>
          <a href="/circuitos.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M9 19h8a2 2 0 0 0 2-2v-1a2 2 0 0 0-2-2H9a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2h6"/></svg>
            Circuitos
          </a>
          <a href="/alertas.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            Alertas
          </a>
          <div class="nav-section-label"><span class="slashes">//</span><span class="label-text">Sistema</span></div>
          <a href="/configuracoes.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Configurações
          </a>
        </div>
        <div class="nav-footer">
          <div class="nav-avatar" id="nav-avatar">?</div>
          <div class="nav-user" id="nav-user"></div>
          <button class="nav-logout" id="nav-logout" type="button" title="Sair">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </nav>
    </div>
    <div class="main-col">
      <div class="topbar-wrap">
        <header class="topbar notch">
          <div class="topbar-title-row">
            <span class="topbar-slash">//</span>
            <h1>Circuitos</h1>
            <div class="topbar-rule"></div>
          </div>
          <div class="topbar-actions">
            <button class="alerts-bell" id="alerts-bell" type="button" title="Alertas">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span class="alerts-badge" id="alerts-badge" hidden>0</span>
            </button>
          </div>
        </header>
      </div>
      <div class="circuitos-shell">
        <div class="circuit-builder">
          <div class="section-label"><span class="slashes">//</span>Circuitos</div>
          <div class="circuits-chips" id="circuits-chips"></div>
          <button class="btn-secondary" id="new-circuit-btn" type="button">+ Novo circuito</button>
          <p id="segment-warning"></p>

          <form class="inline" id="segment-form">
            <div class="ab-flow">
              <div class="ab-side">
                <span class="side-label">Lado A</span>
                <select id="origin-select"></select>
                <select id="origin-iface-select" disabled>
                  <option value="">Selecione o host…</option>
                </select>
              </div>
              <div class="ab-arrow">→</div>
              <div class="ab-side">
                <span class="side-label">Lado B</span>
                <select id="destination-select"></select>
                <select id="destination-iface-select" disabled>
                  <option value="">Selecione o host…</option>
                </select>
              </div>
            </div>
            <p id="segment-iface-hint" class="form-status"></p>
            <input name="signal_warn_threshold_dbm" placeholder="Limiar de sinal (dBm), opcional — ex: -25" />
            <button class="btn-primary" type="submit" id="segment-submit-btn">Criar circuito</button>
          </form>
          <p id="segment-status" class="form-status"></p>
        </div>

        <div class="mini-map-card">
          <div class="section-label"><span class="slashes">//</span>Trecho</div>
          <div id="editor-map"></div>
          <button class="btn-secondary" id="edit-path-btn">Ajustar trajeto</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Outside .app-shell on purpose: .topbar-wrap's filter + .topbar's
       clip-path (.notch) would otherwise contain/clip a fixed-position
       descendant to the 50px-tall topbar. -->
  <div class="alerts-panel" id="alerts-panel" hidden>
    <div class="alerts-panel-header">Alertas ativos</div>
    <div id="alerts-list"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.3/dist/leaflet-geoman.min.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/circuitos.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
