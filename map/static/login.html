<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Natverk NOC — Login</title>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    .login-shell { flex: 1; display: flex; align-items: center; justify-content: center; }
    .login-card {
      width: 320px; background: #1e1e20; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .login-card h1 { font-size: 16px; margin: 0 0 4px; }
    .login-card p { font-size: 12.5px; opacity: 0.55; margin: 0 0 20px; }
    .login-card input {
      width: 100%; background: #232326; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px; padding: 9px 10px; color: inherit; font-size: 13.5px;
      margin-bottom: 10px;
    }
    .login-card button {
      width: 100%; padding: 9px; border-radius: 6px; border: 1px solid rgba(80,160,255,0.5);
      background: rgba(80,160,255,0.15); color: inherit; cursor: pointer; font-size: 13.5px;
    }
    .login-card button:hover { background: rgba(80,160,255,0.28); }
    #login-error { color: #e5484d; font-size: 12.5px; min-height: 16px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="login-shell">
      <form class="login-card" id="login-form">
        <h1>Natverk NOC</h1>
        <p>Entre para acessar o mapa de circuitos.</p>
        <input name="username" placeholder="Usuário" autocomplete="username" required autofocus />
        <input name="password" type="password" placeholder="Senha" autocomplete="current-password" required />
        <button type="submit">Entrar</button>
        <p id="login-error"></p>
      </form>
    </div>
  </div>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const errorEl = document.getElementById('login-error');
      errorEl.textContent = '';
      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: form.username.value, password: form.password.value }),
        });
        if (!resp.ok) {
          const body = await resp.json().catch(() => ({}));
          errorEl.textContent = body.error || 'Falha ao entrar.';
          return;
        }
        window.location.href = '/';
      } catch (err) {
        errorEl.textContent = 'Falha de conexão — tente novamente.';
      }
    });
  </script>
</body>
</html>
