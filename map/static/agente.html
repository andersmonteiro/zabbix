<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Natverk NOC — Agente</title>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    /* margin + cantos arredondados -- igual ao resto do app (.topbar/.nav
       flutuam com a mesma margem lateral/inferior), em vez de um bloco colado
       nas bordas físicas da tela, que deixava a caixa de digitar "mais baixa"
       que o fim da barra lateral mesmo sem a página ter overflow nenhum. */
    .agente-shell {
      flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--bg-canvas);
      margin: 0 24px 16px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
    }
    .agente-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
    .agente-welcome { margin: auto; text-align: center; max-width: 520px; }
    .agente-welcome-icon {
      width: 56px; height: 56px; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center;
      background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent);
    }
    .agente-welcome h2 {
      font-family: var(--sans); font-size: 18px; font-weight: 800; 
      letter-spacing: 0.02em; color: var(--text-primary); margin: 0 0 8px;
    }
    .agente-welcome p {
      font-family: var(--sans); font-size: 11.5px; letter-spacing: 0.01em;
      color: var(--text-muted); margin: 0 0 22px; line-height: 1.6;
    }
    .agente-suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .agente-suggestion-chip {
      background: var(--bg-panel); border: 1px solid var(--border-2); color: var(--text-secondary);
      font-family: var(--sans); font-size: 11px; letter-spacing: 0.02em;
      padding: 8px 14px; cursor: pointer; transition: border-color .12s, color .12s;
    }
    .agente-suggestion-chip:hover { border-color: var(--accent); color: var(--accent); }

    /* Mensagem do assistente é texto corrido sem balão (só a resposta em si,
       largura quase total) -- balão fica reservado pra mensagem do operador,
       alinhada à direita, como num app de chat moderno. */
    .agente-msg {
      font-family: var(--sans); font-size: 13px; letter-spacing: 0.01em; line-height: 1.6; white-space: pre-wrap;
    }
    .agente-msg.user {
      align-self: flex-end; max-width: 68%; padding: 10px 16px; border-radius: 16px;
      background: var(--bg-panel); border: 1px solid var(--border-2); color: var(--text-primary);
    }
    .agente-msg.assistant { align-self: flex-start; max-width: 82%; color: var(--text-secondary); }
    .agente-msg.assistant.notice { color: var(--text-muted); font-style: normal; }

    .agente-input-row { display: flex; align-items: center; gap: 10px; padding: 14px 24px 20px; border-top: 1px solid var(--border); background: var(--bg-panel); flex-shrink: 0; }
    .agente-input-pill {
      flex: 1; display: flex; align-items: center; background: var(--bg-canvas); border: 1px solid var(--border-2);
      border-radius: 999px; padding-left: 16px; transition: border-color .12s;
    }
    .agente-input-pill:focus-within { border-color: var(--accent); }
    .agente-input-row input {
      flex: 1; background: transparent; border: none; color: var(--text-primary);
      padding: 10px 4px; font-size: 12.5px; font-family: var(--sans); outline: none;
    }
    .agente-send-btn {
      width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--accent-fg);
      border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin: 4px;
    }
    .agente-send-btn:hover { opacity: 0.88; }
    .agente-send-btn svg { width: 15px; height: 15px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="nav-wrap">
      <nav class="nav notch">
        <a href="/" class="nav-logo">
          <span class="logo-main">NÄTVERK</span>
          <span class="logo-sub">NOC</span>
        </a>
        <div class="nav-section">
          <div class="nav-section-label"><span class="label-text">Operação</span></div>
          <a href="/" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
            Dashboard
          </a>
          <a href="/agente.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            Agente
          </a>
          <a href="/mapa.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
            Mapa
          </a>
          <a href="/hosts.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><line x1="6" y1="7" x2="6.01" y2="7"/><line x1="6" y1="17" x2="6.01" y2="17"/></svg>
            Hosts
          </a>
          <a href="/circuitos.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M9 19h8a2 2 0 0 0 2-2v-1a2 2 0 0 0-2-2H9a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2h6"/></svg>
            Circuitos
          </a>
          <a href="/alertas.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            Alertas<span class="nav-badge" id="nav-alerts-badge" hidden>0</span>
          </a>
          <div class="nav-section-label"><span class="label-text">Sistema</span></div>
          <a href="/configuracoes.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Configurações
          </a>
        </div>
        <div class="nav-footer">
          <div class="nav-avatar" id="nav-avatar">?</div>
          <div class="nav-user" id="nav-user"></div>
          <button class="nav-logout" id="nav-logout" type="button" title="Sair">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </nav>
    </div>
    <div class="main-col">
      <div class="topbar-wrap">
        <header class="topbar notch">
          <div class="topbar-title-row">
            <h1>Agente</h1>
            <div class="topbar-rule"></div>
          </div>
          <div class="topbar-actions">
            <button class="alerts-bell" id="alerts-bell" type="button" title="Alertas">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span class="alerts-badge" id="alerts-badge" hidden>0</span>
            </button>
          </div>
        </header>
      </div>
      <main class="agente-shell">
        <div class="agente-messages" id="agente-messages">
          <div class="agente-welcome">
            <div class="agente-welcome-icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            </div>
            <h2>Como posso ajudar hoje?</h2>
            <p>Em breve, consulta direta aos equipamentos: sinal óptico, PPPoE conectados,<br />prefixos BGP e mais — sem depender só do que o Zabbix já coletou.</p>
            <div class="agente-suggestions">
              <button type="button" class="agente-suggestion-chip">Qual o sinal óptico da porta 3 do switch de Novo Progresso?</button>
              <button type="button" class="agente-suggestion-chip">Quantos PPPoE estão online em Castelo?</button>
              <button type="button" class="agente-suggestion-chip">A interface 3 do switch de Novo Progresso caiu quando?</button>
            </div>
          </div>
        </div>
        <form class="agente-input-row" id="agente-form">
          <div class="agente-input-pill">
            <input id="agente-input" placeholder="Pergunte algo sobre a rede..." autocomplete="off" />
          </div>
          <button class="agente-send-btn" type="submit" title="Enviar" aria-label="Enviar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </form>
      </main>
    </div>
  </div>

  <!-- Outside .app-shell on purpose: .topbar-wrap's filter + .topbar's
       clip-path (.notch) would otherwise contain/clip a fixed-position
       descendant to the 50px-tall topbar. -->
  <div class="alerts-panel" id="alerts-panel" hidden>
    <div class="alerts-panel-header">Alertas ativos</div>
    <div id="alerts-list"></div>
  </div>

  <script src="js/nav.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/agente.js"></script>
</body>
</html>
