services:
  zabbix-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: zabbix-server-custom
    container_name: zabbix-server
    restart: unless-stopped
    ports:
      - "10051:10051"
    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-zabbix}
      POSTGRES_DB: ${POSTGRES_DB-zabbix}
      MIBS: ALL
      MIBDIRS: /usr/share/snmp/mibs
      # Sem isso, externalscripts que lidam com texto acentuado (nomes de
      # interface, alertas em pt-BR) quebram com UnicodeEncodeError — o
      # locale padrão do container é POSIX/ASCII. C.utf8 já vem no Alpine
      # base, não precisa instalar pacote de locale.
      LANG: C.utf8
      LC_ALL: C.utf8
    depends_on:
      - postgres
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./externalscripts:/usr/lib/zabbix/externalscripts
      - ./externalscripts/lic/.lic:/etc/zabbix/.lic
      - ./net-snmp/mibs:/usr/share/snmp/mibs:ro
    networks:
      - network-zabbix
  zabbix-frontend:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.4.11
    restart: unless-stopped
    container_name: zabbix-frontend
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-zabbix}
      POSTGRES_DB: ${POSTGRES_DB-zabbix}
      PHP_TZ: ${TZ}
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
    depends_on:
      - zabbix-server
    networks:
      - network-zabbix
  zabbix-agent:
    image: zabbix/zabbix-agent:ubuntu-7.4.11
    container_name: zabbix-agent
    restart: unless-stopped
    ports:
      - "10050:10050"
    environment:
      ZBX_ACTIVE_ALLOW: false
      TZ: ${TZ}
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      ZBX_HOSTNAME: zabbix-agent
      ZBX_HOSTNAMEITEM: system.hostname
    depends_on:
      - zabbix-server
    networks:
      - network-zabbix
  postgres:
    image: timescale/timescaledb:2.30.1-pg18
    container_name: postgres
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - postgres-tsdb:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-zabbix}
      POSTGRES_DB: ${POSTGRES_DB-zabbix}
      PG_DATA: /var/lib/postgresql/data/pgdata
    networks:
      - network-zabbix
  grafana:
    image: grafana/grafana:13.0.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-Natverk-Noc-2026!}
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app
      TZ: ${TZ}
    user: "472"
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/logos:/usr/share/grafana/public/img
    depends_on:
      - zabbix-frontend
    networks:
      - network-zabbix
volumes:
  postgres-tsdb: {}
  grafana: {}
networks:
  network-zabbix:
    driver: bridge
    name: natverk-zabbix-net
